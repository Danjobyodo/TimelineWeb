<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6366f1" />
  <title>Timeline Trace</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>

  <style>
    /* ─── Design Tokens ─── */
    :root {
      --bg:         #060912;
      --s0:         #0b0f1a;
      --s1:         #101520;
      --s2:         #161c2d;
      --s3:         #1e2640;
      --border:     rgba(148,163,184,.10);
      --border-md:  rgba(148,163,184,.16);
      --border-lg:  rgba(148,163,184,.22);
      --text:       #e2e8f0;
      --muted:      #94a3b8;
      --dim:        #4e5a6e;
      --accent:     #6366f1;
      --accent-lt:  #818cf8;
      --accent-dim: rgba(99,102,241,.15);
      --accent-glow:rgba(99,102,241,.30);
      --cyan:       #22d3ee;
      --cyan-dim:   rgba(34,211,238,.15);
      --violet:     #a78bfa;
      --violet-dim: rgba(167,139,250,.15);
      --green:      #4ade80;
      --green-dim:  rgba(74,222,128,.15);
      --amber:      #fbbf24;
      --amber-dim:  rgba(251,191,36,.15);
      --rose:       #f87171;
      --rose-dim:   rgba(248,113,113,.15);
      --shadow-sm:  0 1px 3px rgba(0,0,0,.4);
      --shadow:     0 4px 16px rgba(0,0,0,.45);
      --shadow-lg:  0 10px 40px rgba(0,0,0,.55);
      --radius-sm:  8px;
      --radius:     12px;
      --radius-lg:  16px;
      --mono:       ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: inherit; }
    button { font-family: inherit; }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.15); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.25); }

    /* ─── Topbar ─── */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(10,13,22,.92);
      backdrop-filter: blur(16px) saturate(1.4);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-name {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .2px;
      line-height: 1;
    }
    .brand-desc {
      font-size: 11px;
      color: var(--muted);
      line-height: 1;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Buttons ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-md);
      background: var(--s2);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s, opacity .15s;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover { background: var(--s3); border-color: var(--border-lg); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .btn.accent {
      background: var(--accent-dim);
      border-color: rgba(99,102,241,.40);
      color: var(--accent-lt);
    }
    .btn.accent:hover {
      background: rgba(99,102,241,.22);
      border-color: rgba(99,102,241,.55);
    }
    .btn.icon-only { padding: 7px 9px; }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* file input wrapper */
    .file-btn { position: relative; overflow: hidden; }
    .file-btn input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      font-size: 0;
    }

    /* pill badge */
    .pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid var(--border-md);
      background: var(--s2);
      color: var(--muted);
      white-space: nowrap;
    }

    /* ─── Layout ─── */
    .layout {
      height: calc(100vh - 56px);
      display: grid;
      grid-template-columns: 340px 1fr;
    }
    @media (max-width: 860px) {
      body { overflow: auto; }
      .layout { height: auto; grid-template-columns: 1fr; grid-template-rows: 55svh auto; }
    }

    /* ─── Side Panel ─── */
    .panel {
      display: flex;
      flex-direction: column;
      background: var(--s0);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }
    @media (max-width: 860px) {
      .panel { border-right: none; border-top: 1px solid var(--border); order: 2; }
    }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ─── Stats Row ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .stat {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 10px 9px;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: .4px;
      font-weight: 600;
    }

    /* ─── Privacy Notice ─── */
    .notice {
      margin: 0 12px 12px;
      padding: 9px 11px;
      border-radius: var(--radius);
      background: rgba(99,102,241,.07);
      border: 1px solid rgba(99,102,241,.18);
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.4;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .notice-icon { flex-shrink: 0; margin-top: 1px; opacity: .65; }

    /* ─── Day Header ─── */
    .day-header {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--s1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .day-meta { display: flex; flex-direction: column; gap: 2px; }
    .day-name { font-size: 16px; font-weight: 800; line-height: 1; }
    .day-sub { font-size: 11px; color: var(--muted); }
    .day-nav { display: flex; align-items: center; gap: 6px; }

    /* ─── Calendar ─── */
    .calendar {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }
    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .cal-month { font-weight: 700; font-size: 13px; }
    .cal-nav { display: flex; gap: 4px; }
    .cal-nav-btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      border: 1px solid var(--border-md);
      background: var(--s2);
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: background .1s, color .1s;
    }
    .cal-nav-btn:hover { background: var(--s3); color: var(--text); }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--dim);
      padding: 3px 0 4px;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .cal-day {
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      position: relative;
      user-select: none;
      border: 1px solid transparent;
      gap: 2px;
      color: var(--dim);
    }
    .cal-day.empty { background: transparent; }
    .cal-day.avail {
      background: var(--s2);
      border-color: var(--border);
      color: var(--text);
      cursor: pointer;
      transition: background .1s, border-color .1s;
    }
    .cal-day.avail:hover { background: var(--s3); border-color: var(--border-md); }
    .cal-day.selected {
      background: var(--accent-dim) !important;
      border-color: rgba(99,102,241,.45) !important;
      color: var(--accent-lt) !important;
      font-weight: 800;
    }
    .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
      opacity: .7;
    }
    .cal-day.selected .cal-dot { background: var(--accent-lt); opacity: 1; }

    /* ─── Timeline List ─── */
    .tl-list {
      padding: 12px 12px 20px;
    }
    .tl-empty {
      padding: 16px 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .tl-items {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
    }
    /* vertical connector line */
    .tl-items::before {
      content: "";
      position: absolute;
      left: 22px;
      top: 20px;
      bottom: 20px;
      width: 1px;
      background: linear-gradient(to bottom,
        transparent,
        var(--border-md) 10%,
        var(--border-md) 90%,
        transparent
      );
    }
    .tl-item {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      padding: 8px 0;
      cursor: pointer;
      position: relative;
    }
    .tl-item:hover .tl-card { border-color: var(--border-lg); background: var(--s3); }
    .tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      z-index: 1;
    }
    .tl-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid var(--s1);
      flex-shrink: 0;
      margin-top: 14px;
    }
    .tl-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
    }
    .tl-card {
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 11px;
      transition: background .12s, border-color .12s;
      min-width: 0;
    }
    .tl-title-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 2px;
      min-width: 0;
    }
    .tl-emoji { font-size: 14px; flex-shrink: 0; line-height: 1; }
    .tl-name {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .tl-sub {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .tl-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    /* ─── Footer ─── */
    .panel-footer {
      padding: 10px 12px 14px;
      font-size: 11px;
      color: var(--dim);
      line-height: 1.5;
      border-top: 1px solid var(--border);
    }

    /* ─── Map ─── */
    .map-wrap {
      position: relative;
      background: #0a0e18;
    }
    #map { position: absolute; inset: 0; }

    /* ─── Toast ─── */
    .toast {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 500;
      min-width: 200px;
      max-width: min(440px, calc(100% - 28px));
      padding: 11px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border-md);
      background: rgba(16,21,32,.93);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow-lg);
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px) scale(.98);
      transition: opacity .2s, transform .2s;
    }
    .toast.show {
      opacity: 1;
      transform: none;
    }
    .toast-title { font-weight: 700; font-size: 13px; }
    .toast-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* ─── Leaflet Overrides ─── */
    .leaflet-popup-content-wrapper {
      background: rgba(16,21,32,.96) !important;
      border: 1px solid var(--border-lg) !important;
      box-shadow: var(--shadow-lg) !important;
      border-radius: var(--radius) !important;
      color: var(--text) !important;
      backdrop-filter: blur(10px);
    }
    .leaflet-popup-tip { background: rgba(16,21,32,.96) !important; }
    .leaflet-popup-content { color: var(--text) !important; font-family: inherit !important; font-size: 13px !important; }
    .leaflet-control-zoom {
      border: 1px solid var(--border-md) !important;
      box-shadow: var(--shadow) !important;
      border-radius: var(--radius-sm) !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      background: rgba(16,21,32,.88) !important;
      color: var(--text) !important;
      border-color: var(--border) !important;
      backdrop-filter: blur(8px);
    }
    .leaflet-control-zoom a:hover {
      background: rgba(30,38,64,.92) !important;
    }
    .leaflet-control-attribution {
      background: rgba(6,9,18,.7) !important;
      color: var(--dim) !important;
      font-size: 10px !important;
      backdrop-filter: blur(4px);
    }
    .leaflet-control-attribution a { color: var(--muted) !important; }

    /* ─── Animations ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    .tl-item { animation: fadeUp .18s ease both; }
  </style>
</head>

<body>
  <!-- ── Topbar ── -->
  <header class="topbar">
    <div class="brand">
      <img src="./new_icon.png" alt="" class="brand-icon" />
      <div class="brand-text">
        <div class="brand-name">Timeline Trace</div>
        <div class="brand-desc">ローカル処理・データ送信なし</div>
      </div>
    </div>

    <div class="topbar-right">
      <span class="pill" id="formatPill">No file</span>

      <label class="btn accent file-btn" title="Google Timeline JSONを開く">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h7l3 3v9H4V4z" stroke-linejoin="round"/>
          <path d="M11 4v3h3"/>
          <path d="M7 11h6M10 8v6" stroke-linecap="round"/>
        </svg>
        <span>JSONを開く</span>
        <input id="fileInput" type="file" accept=".json,application/json" />
      </label>

      <button class="btn icon-only" id="prevBtn" disabled title="前の有効日 (Alt+←)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 4 7 10 13 16"/>
        </svg>
      </button>
      <button class="btn icon-only" id="nextBtn" disabled title="次の有効日 (Alt+→)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="7 4 13 10 7 16"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Main Layout ── -->
  <div class="layout">

    <!-- ── Side Panel ── -->
    <aside class="panel" id="panel">
      <div class="panel-scroll">

        <!-- Stats -->
        <div class="stats">
          <div class="stat">
            <div class="stat-val" id="countItems">0</div>
            <div class="stat-lbl">Items</div>
          </div>
          <div class="stat">
            <div class="stat-val" id="countDays">0</div>
            <div class="stat-lbl">Days</div>
          </div>
          <div class="stat">
            <div class="stat-val" id="statDay">—</div>
            <div class="stat-lbl">Selected</div>
          </div>
        </div>

        <!-- Privacy notice -->
        <div class="notice" style="margin-top:0; border-radius:0; margin:0; border-left:none; border-right:none; border-top:none;">
          <svg class="notice-icon" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M10 2L3 5v5c0 4.4 3 8.2 7 9 4-0.8 7-4.6 7-9V5L10 2z" stroke-linejoin="round"/>
            <path d="M10 9v3M10 7h.01" stroke-linecap="round"/>
          </svg>
          <span>JSONはブラウザ内だけで処理されます。マップタイルのみ外部サーバーに接続します。</span>
        </div>

        <!-- Day header (sticky inside scroll) -->
        <div class="day-header">
          <div class="day-meta">
            <div class="day-name" id="dayTitle">データなし</div>
            <div class="day-sub" id="daySub">JSONを選んでください</div>
          </div>
          <div class="day-nav">
            <span class="pill" id="dayPill">—</span>
          </div>
        </div>

        <!-- Calendar -->
        <div class="calendar" id="calendar">
          <div style="padding:8px 0;color:var(--muted);font-size:12px;">JSONを読み込むとカレンダーが表示されます。</div>
        </div>

        <!-- Timeline list -->
        <div class="tl-list" id="list">
          <div class="tl-empty">JSONを選んでください。</div>
        </div>

      </div><!-- /panel-scroll -->

      <div class="panel-footer">
        Alt + ← / → で前後の日に移動できます。
      </div>
    </aside>

    <!-- ── Map ── -->
    <main class="map-wrap">
      <div id="map"></div>
      <div class="toast" id="toast">
        <div class="toast-title" id="toastMsg"></div>
        <div class="toast-sub" id="toastSmall"></div>
      </div>
    </main>

  </div><!-- /layout -->

  <script type="module" src="./app.js"></script>
</body>
</html>
